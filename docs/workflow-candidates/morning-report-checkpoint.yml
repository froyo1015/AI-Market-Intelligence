# REVIEW-ONLY FRAGMENT. Do not register as an Actions workflow.
# Insert into generate job of .github/workflows/daily_market_brief.yml.
# Prerequisites: protected `morning-reports` branch; job permissions:
#   contents: write
#   actions: read
# Keep the existing daily-market-brief concurrency group and 08:30 TPE schedule.
# Place slot/source discovery after tests and before "Regenerate intelligence
# pipeline". Place checkpoint/upload steps AFTER that pipeline, because its
# public-data allowlist cleanup removes extra docs/data files.

- name: Resolve Morning Report slot
  id: morning_slot
  shell: bash
  run: |
    python - <<'PY'
    from src.morning_report.checkpoint_cli import scheduled_slot
    from src.morning_report.baseline import iso, instant
    from pathlib import Path
    import os
    slot=scheduled_slot(os.getenv('MORNING_SCHEDULED_AT') or None)
    with Path(os.environ['GITHUB_OUTPUT']).open('a') as out:
        out.write('slot='+slot+'\n')
        out.write('cutoff_utc='+iso(instant(slot))+'\n')
        out.write('report_date='+instant(slot).astimezone(__import__('zoneinfo').ZoneInfo('Asia/Taipei')).date().isoformat()+'\n')
    PY

- name: Find latest source completed before Morning Report cutoff
  id: morning_source
  uses: actions/github-script@v7
  env:
    MORNING_CUTOFF: ${{ steps.morning_slot.outputs.cutoff_utc }}
  with:
    script: |
      const {owner, repo} = context.repo;
      const cutoff = Date.parse(process.env.MORNING_CUTOFF);
      const runs = await github.paginate(github.rest.actions.listWorkflowRuns,
        {owner, repo, workflow_id:'daily_market_brief.yml', branch:context.payload.repository.default_branch,
         status:'success', per_page:100});
      for (const r of runs.sort((a,b)=>b.id-a.id)) {
        if (r.id >= context.runId || Date.parse(r.updated_at) > cutoff ||
            r.head_repository?.full_name !== `${owner}/${repo}`) continue;
        const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts,
          {owner,repo,run_id:r.id,per_page:100});
        const a = artifacts.find(a=>!a.expired && a.name.startsWith('daily-market-brief-'));
        if (a) { core.setOutput('id',String(a.id)); core.setOutput('run_id',String(r.id)); return; }
      }
      core.setOutput('id','');

- name: Download pre-cutoff Morning Report source
  if: steps.morning_source.outputs.id != ''
  uses: actions/download-artifact@v4
  with:
    artifact-ids: ${{ steps.morning_source.outputs.id }}
    run-id: ${{ steps.morning_source.outputs.run_id }}
    github-token: ${{ github.token }}
    merge-multiple: true
    path: work/morning-source

# Existing "Regenerate intelligence pipeline" step runs here, unchanged.
# The next step must run after its docs/data cleanup and before Pages upload.

- name: Discover or create fixed Morning Report checkpoint
  id: morning_checkpoint
  continue-on-error: true # Daily pipeline remains independent; never publish a failed checkpoint.
  env:
    GITHUB_TOKEN: ${{ github.token }}
  run: >-
    python -m src.morning_report.checkpoint_cli
    --scheduled-at '${{ steps.morning_slot.outputs.slot }}'
    --source-root work/morning-source
    --public-out docs/data/morning_report_public.json

- name: Upload public Morning Report backup artifact
  if: steps.morning_checkpoint.outcome == 'success' && steps.morning_checkpoint.outputs.created == 'true'
  uses: actions/upload-artifact@v7
  with:
    name: morning-report-checkpoint-${{ steps.morning_slot.outputs.report_date }}
    path: docs/data/morning_report_public.json
    if-no-files-found: error
    retention-days: 30

# Existing mutable daily pipeline steps then continue unchanged.
# If a pre-existing docs/data/morning_report_public.json is ever tracked,
# remove that tracked file in a reviewed migration before activating this flow.
