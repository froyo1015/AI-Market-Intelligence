name: Daily Market Brief

on:
  schedule:
    - cron: "30 8 * * *"
      timezone: "Asia/Taipei"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-market-brief
  cancel-in-progress: false

jobs:
  generate:
    name: Test and generate daily outputs
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Regenerate intelligence pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_GROUNDED_BRIEF_MODEL: ${{ vars.OPENAI_GROUNDED_BRIEF_MODEL || 'gpt-5.6-luna' }}
          OPENAI_GROUNDED_BRIEF_TIMEOUT_SECONDS: "30"
          OPENAI_GROUNDED_BRIEF_MAX_OUTPUT_TOKENS: "2400"
          OPENAI_GROUNDED_BRIEF_MAX_INPUT_CHARS: "200000"
          OPENAI_GROUNDED_BRIEF_TRANSIENT_RETRIES: "0"
        run: python -m src.orchestration.pipeline

      - name: Verify generated outputs
        run: |
          test -s src/output/market_snapshot.json
          test -s src/output/run_manifest.json
          test -s src/output/daily_intelligence.json
          test -s src/output/top_intelligence.json
          test -s src/output/daily_market_brief.md
          test -s src/output/ai_market_brief.md
          test -s src/output/ai_brief_evaluation.json
          test -s docs/index.html
          test -s docs/intelligence.html
          test -s docs/assets/intelligence.js
          test -s docs/data/run_manifest.json

      - name: Monitor grounded AI production trial
        run: >-
          python -m src.evaluation.trial_monitor
          --manifest src/output/run_manifest.json
          --evaluation src/output/ai_brief_evaluation.json
          --summary "$GITHUB_STEP_SUMMARY"

      - name: Send Telegram market brief
        if: ${{ success() }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: >-
          python -m src.telegram.bot
          --input src/output/daily_market_brief.md
          --skip-if-unconfigured

      - name: Upload daily market brief artifact
        uses: actions/upload-artifact@v7
        with:
          name: daily-market-brief-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            src/output/market_snapshot.json
            src/output/macro_snapshot.json
            src/output/economic_calendar.json
            src/output/news_items.json
            src/output/events.json
            src/output/observations.json
            src/output/evidence.json
            src/output/evidence_bundle.json
            src/output/market_signals.json
            src/output/market_regime.json
            src/output/risk_monitor.json
            src/output/daily_intelligence.json
            src/output/top_intelligence.json
            src/output/daily_market_brief.md
            src/output/ai_market_brief.md
            src/output/ai_brief_evaluation.json
            src/output/run_manifest.json
            docs/index.html
            docs/intelligence.html
            docs/assets/intelligence.js
            docs/data/
          if-no-files-found: error
          retention-days: 30

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    name: Deploy GitHub Pages
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
