name: Daily Market Brief

on:
  schedule:
    - cron: "30 8 * * *"
      timezone: "Asia/Taipei"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: daily-market-brief
  cancel-in-progress: false

jobs:
  generate:
    name: Test and generate daily outputs
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Find previous available report
        id: previous
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns,
              {owner, repo, workflow_id:'daily_market_brief.yml', branch:context.payload.repository.default_branch, status:'success', per_page:100});
            for (const r of runs.sort((a,b)=>b.id-a.id)) {
              if (r.id >= context.runId || r.head_repository.full_name !== `${owner}/${repo}`) continue;
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts,{owner,repo,run_id:r.id,per_page:100});
              const a = artifacts.find(a=>!a.expired && a.name.startsWith('daily-market-brief-'));
              if (a) { core.setOutput('id',String(a.id)); return; }
            }
            core.setOutput('id','');
      - name: Download previous report
        if: steps.previous.outputs.id != ''
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.previous.outputs.id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: work/previous-report
      - name: Prepare previous observation comparison
        env:
          PREVIOUS_REPORT_ID: ${{ steps.previous.outputs.id }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from src.pages.previous_report import project
          target = Path('docs/previous-market-snapshot.json')
          target.unlink(missing_ok=True)
          if os.environ.get('PREVIOUS_REPORT_ID'):
              base = Path('work/previous-report')
              candidates = [base/'src/output/market_snapshot.json', base/'market_snapshot.json']
              source = next((p for p in candidates if p.is_file()), None)
              if source:
                  try:
                      result = project(json.loads(source.read_text()))
                      target.write_text(json.dumps(result, indent=2) + '\n')
                  except (ValueError, KeyError, TypeError):
                      print('Previous market snapshot invalid; comparison unavailable')
          PY
      - name: Regenerate intelligence pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_GROUNDED_BRIEF_MODEL: ${{ vars.OPENAI_GROUNDED_BRIEF_MODEL || 'gpt-5.6-luna' }}
          OPENAI_GROUNDED_BRIEF_TIMEOUT_SECONDS: "30"
          OPENAI_GROUNDED_BRIEF_MAX_OUTPUT_TOKENS: "2400"
          OPENAI_GROUNDED_BRIEF_MAX_INPUT_CHARS: "200000"
          OPENAI_GROUNDED_BRIEF_TRANSIENT_RETRIES: "0"
        run: python -m src.orchestration.pipeline

      - name: Discover latest shadow public projection
        id: shadow
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const all = await github.paginate(github.rest.actions.listArtifactsForRepo,
              {owner, repo, name: 'derivatives-shadow-public', per_page: 100});
            for (const a of all.sort((a,b) => b.id-a.id)) {
              if (a.workflow_run?.head_branch !== context.payload.repository.default_branch) continue;
              const {data:r} = await github.rest.actions.getWorkflowRun({owner, repo, run_id:a.workflow_run.id});
              if (r.path !== '.github/workflows/derivatives_shadow.yml' ||
                  r.head_repository.full_name !== `${owner}/${repo}`) continue;
              if (a.expired) break;
              core.setOutput('id', String(a.id)); return;
            }
            core.setOutput('id', '');
      - name: Download shadow public projection
        if: steps.shadow.outputs.id != ''
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.shadow.outputs.id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: work/shadow-public
      - name: Validate shadow public projection for Pages
        env:
          SHADOW_ARTIFACT_ID: ${{ steps.shadow.outputs.id }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from src.pages.derivatives_schema import validate_public
          target = Path('docs/derivatives-shadow.json')
          target.unlink(missing_ok=True)
          if os.environ.get('SHADOW_ARTIFACT_ID'):
              payload = json.loads(Path('work/shadow-public/derivatives-shadow.json').read_text())
              if not validate_public(payload):
                  raise SystemExit('Invalid shadow public artifact')
              target.write_text(json.dumps(payload, indent=2) + '\n')
          PY
      - name: Verify generated outputs
        run: |
          test -s src/output/market_snapshot.json
          test -s src/output/run_manifest.json
          test -s src/output/daily_intelligence.json
          test -s src/output/top_intelligence.json
          test -s src/output/daily_market_brief.md
          test -s src/output/ai_market_brief.md
          test -s src/output/ai_brief_evaluation.json
          test -s docs/index.html
          test -s docs/intelligence.html
          test -s docs/assets/intelligence.js
          test -s docs/data/run_manifest.json

      - name: Monitor grounded AI production trial
        run: >-
          python -m src.evaluation.trial_monitor
          --manifest src/output/run_manifest.json
          --evaluation src/output/ai_brief_evaluation.json
          --summary "$GITHUB_STEP_SUMMARY"

      - name: Send Telegram market brief
        if: ${{ success() }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: >-
          python -m src.telegram.bot
          --input src/output/daily_market_brief.md
          --skip-if-unconfigured

      - name: Upload daily market brief artifact
        uses: actions/upload-artifact@v7
        with:
          name: daily-market-brief-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            src/output/market_snapshot.json
            src/output/macro_snapshot.json
            src/output/economic_calendar.json
            src/output/news_items.json
            src/output/events.json
            src/output/observations.json
            src/output/evidence.json
            src/output/evidence_bundle.json
            src/output/market_signals.json
            src/output/market_regime.json
            src/output/risk_monitor.json
            src/output/daily_intelligence.json
            src/output/top_intelligence.json
            src/output/daily_market_brief.md
            src/output/ai_market_brief.md
            src/output/ai_brief_evaluation.json
            src/output/run_manifest.json
            docs/index.html
            docs/intelligence.html
            docs/assets/intelligence.js
            docs/data/
          if-no-files-found: error
          retention-days: 30

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    name: Deploy GitHub Pages
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
