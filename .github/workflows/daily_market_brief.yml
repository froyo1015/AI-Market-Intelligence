name: Daily Market Brief

on:
  schedule:
    # 00:30 UTC = 08:30 Asia/Taipei year-round.
    - cron: "30 0 * * *"
    # One bounded Morning delivery retry at 09:06 Taipei.
    - cron: "6 1 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: daily-market-brief
  cancel-in-progress: false

jobs:
  morning_retry_preflight:
    name: Check whether Morning retry is needed
    if: github.event.schedule == '6 1 * * *'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      needed: ${{ steps.check.outputs.needed }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - id: check
        name: Verify canonical Morning and Pages projection
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m src.morning_report.retry_preflight

  generate:
    name: Test and generate daily outputs
    needs: morning_retry_preflight
    if: always() && (github.event.schedule != '6 1 * * *' || needs.morning_retry_preflight.outputs.needed == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # create-only date file on the dedicated morning-reports branch
      actions: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Resolve Morning Report slot
        id: morning_slot
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from zoneinfo import ZoneInfo
          from src.morning_report.baseline import instant, iso
          from src.morning_report.checkpoint_cli import scheduled_slot
          slot=scheduled_slot(os.getenv('MORNING_SCHEDULED_AT') or None)
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as out:
              out.write('slot='+slot+'\n')
              out.write('cutoff_utc='+iso(instant(slot))+'\n')
              out.write('report_date='+instant(slot).astimezone(ZoneInfo('Asia/Taipei')).date().isoformat()+'\n')
          PY

      - name: Find latest source completed before Morning Report cutoff
        id: morning_source
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          MORNING_CUTOFF: ${{ steps.morning_slot.outputs.cutoff_utc }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const cutoff = Date.parse(process.env.MORNING_CUTOFF);
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns,
              {owner, repo, workflow_id:'daily_market_brief.yml', branch:context.payload.repository.default_branch,
               status:'success', per_page:100});
            for (const r of runs.sort((a,b)=>b.id-a.id)) {
              if (r.id >= context.runId || Date.parse(r.updated_at) > cutoff ||
                  r.head_repository?.full_name !== `${owner}/${repo}`) continue;
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts,
                {owner,repo,run_id:r.id,per_page:100});
              const a = artifacts.find(a=>!a.expired && a.name.startsWith('daily-market-brief-'));
              if (a) { core.setOutput('id',String(a.id)); core.setOutput('run_id',String(r.id)); return; }
            }
            core.setOutput('id','');

      - name: Download pre-cutoff Morning Report source
        if: steps.morning_source.outputs.id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.morning_source.outputs.id }}
          run-id: ${{ steps.morning_source.outputs.run_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: work/morning-source

      - name: Find previous available report
        id: previous
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns,
              {owner, repo, workflow_id:'daily_market_brief.yml', branch:context.payload.repository.default_branch, status:'success', per_page:100});
            for (const r of runs.sort((a,b)=>b.id-a.id)) {
              if (r.id >= context.runId || r.head_repository.full_name !== `${owner}/${repo}`) continue;
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts,{owner,repo,run_id:r.id,per_page:100});
              const a = artifacts.find(a=>!a.expired && a.name.startsWith('daily-market-brief-'));
              if (a) { core.setOutput('id',String(a.id)); core.setOutput('run_id',String(r.id)); return; }
            }
            core.setOutput('id','');
      - name: Download previous report
        if: steps.previous.outputs.id != ''
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.previous.outputs.id }}
          run-id: ${{ steps.previous.outputs.run_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: work/previous-report
      - name: Prepare previous observation comparison
        env:
          PREVIOUS_REPORT_ID: ${{ steps.previous.outputs.id }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from src.pages.previous_report import project
          target = Path('docs/previous-market-snapshot.json')
          target.unlink(missing_ok=True)
          if os.environ.get('PREVIOUS_REPORT_ID'):
              base = Path('work/previous-report')
              candidates = [base/'src/output/market_snapshot.json', base/'market_snapshot.json']
              source = next((p for p in candidates if p.is_file()), None)
              if source:
                  try:
                      result = project(json.loads(source.read_text()))
                      target.write_text(json.dumps(result, indent=2) + '\n')
                  except (ValueError, KeyError, TypeError):
                      print('Previous market snapshot invalid; comparison unavailable')
          PY
      - name: Regenerate intelligence pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_GROUNDED_BRIEF_MODEL: ${{ vars.OPENAI_GROUNDED_BRIEF_MODEL || 'gpt-5.6-luna' }}
          OPENAI_GROUNDED_BRIEF_TIMEOUT_SECONDS: "30"
          OPENAI_GROUNDED_BRIEF_MAX_OUTPUT_TOKENS: "2400"
          OPENAI_GROUNDED_BRIEF_MAX_INPUT_CHARS: "200000"
          OPENAI_GROUNDED_BRIEF_TRANSIENT_RETRIES: "0"
        run: |
          # Morning retry reuses the same validated intelligence contract without
          # paying for another LLM request.
          if [[ "${{ github.event.schedule }}" == "6 1 * * *" ]]; then
            unset OPENAI_API_KEY
          fi
          python -m src.orchestration.pipeline

      - name: Discover or create fixed Morning Report checkpoint
        id: morning_checkpoint
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: >-
          python -m src.morning_report.checkpoint_cli
          --scheduled-at '${{ steps.morning_slot.outputs.slot }}'
          --source-root work/morning-source
          --public-out docs/data/morning_report_public.json
          --status-out docs/data/morning_delivery_status.json

      - name: Validate and report Morning delivery state
        run: |
          state=$(python -m src.morning_report.delivery \
            --status docs/data/morning_delivery_status.json \
            --report docs/data/morning_report_public.json)
          echo "Morning Report delivery: ${state}" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$state" != "created" && "$state" != "reused" ]]; then
            echo "::warning::Morning Report not delivered: ${state}; see public delivery status artifact"
          fi
          if [[ "$state" == "failed" ]]; then
            echo "Checkpoint verification failed; retaining the previous Pages deployment" >&2
            exit 1
          fi

      - name: Upload public Morning Report backup artifact
        if: steps.morning_checkpoint.outcome == 'success' && steps.morning_checkpoint.outputs.created == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: morning-report-checkpoint-${{ steps.morning_slot.outputs.report_date }}
          path: docs/data/morning_report_public.json
          if-no-files-found: error
          retention-days: 30

      - name: Bind pre-cutoff daily reference to fixed Morning Report
        if: steps.morning_checkpoint.outcome == 'success'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m src.daily_reference.checkpoint_cli morning

      - name: Generate official daily market reference
        continue-on-error: true
        run: python -m src.daily_reference.pipeline

      - name: Validate daily reference public sidecars
        run: python -m src.daily_reference.public_validate

      - name: Discover latest shadow public projection
        id: shadow
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const all = await github.paginate(github.rest.actions.listArtifactsForRepo,
              {owner, repo, name: 'derivatives-shadow-public', per_page: 100});
            for (const a of all.sort((a,b) => b.id-a.id)) {
              if (a.workflow_run?.head_branch !== context.payload.repository.default_branch) continue;
              const {data:r} = await github.rest.actions.getWorkflowRun({owner, repo, run_id:a.workflow_run.id});
              if (r.path !== '.github/workflows/derivatives_shadow.yml' ||
                  r.head_repository.full_name !== `${owner}/${repo}`) continue;
              if (a.expired) break;
              core.setOutput('id', String(a.id)); core.setOutput('run_id', String(r.id)); return;
            }
            core.setOutput('id', '');
      - name: Download shadow public projection
        if: steps.shadow.outputs.id != ''
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.shadow.outputs.id }}
          run-id: ${{ steps.shadow.outputs.run_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: work/shadow-public
      - name: Validate shadow public projection for Pages
        env:
          SHADOW_ARTIFACT_ID: ${{ steps.shadow.outputs.id }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from src.pages.derivatives_schema import validate_public
          target = Path('docs/derivatives-shadow.json')
          target.unlink(missing_ok=True)
          if os.environ.get('SHADOW_ARTIFACT_ID'):
              payload = json.loads(Path('work/shadow-public/derivatives-shadow.json').read_text())
              if not validate_public(payload):
                  raise SystemExit('Invalid shadow public artifact')
              target.write_text(json.dumps(payload, indent=2) + '\n')
          PY
      - name: Verify generated outputs
        run: |
          test -s src/output/market_snapshot.json
          test -s src/output/run_manifest.json
          test -s src/output/daily_intelligence.json
          test -s src/output/top_intelligence.json
          test -s src/output/minimum_useful_status.json
          test -s src/output/daily_market_brief.md
          test -s src/output/ai_market_brief.md
          test -s src/output/ai_brief_evaluation.json
          test -s docs/index.html
          test -s docs/intelligence.html
          test -s docs/assets/intelligence.js
          test -s docs/data/minimum_useful_status.json
          test -s docs/data/run_manifest.json
          test -s docs/data/morning_delivery_status.json

      - name: Monitor grounded AI production trial
        run: >-
          python -m src.evaluation.trial_monitor
          --manifest src/output/run_manifest.json
          --evaluation src/output/ai_brief_evaluation.json
          --summary "$GITHUB_STEP_SUMMARY"

      - name: Send Telegram market brief
        if: ${{ success() }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: >-
          python -m src.telegram.bot
          --input src/output/daily_market_brief.md
          --skip-if-unconfigured

      - name: Upload daily market brief artifact
        uses: actions/upload-artifact@v7
        with:
          name: daily-market-brief-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            src/output/market_snapshot.json
            src/output/macro_snapshot.json
            src/output/economic_calendar.json
            src/output/news_items.json
            src/output/events.json
            src/output/observations.json
            src/output/evidence.json
            src/output/evidence_bundle.json
            src/output/market_signals.json
            src/output/market_regime.json
            src/output/risk_monitor.json
            src/output/daily_intelligence.json
            src/output/top_intelligence.json
            src/output/minimum_useful_status.json
            src/output/daily_market_brief.md
            src/output/ai_market_brief.md
            src/output/ai_brief_evaluation.json
            src/output/run_manifest.json
            docs/index.html
            docs/intelligence.html
            docs/assets/intelligence.js
            docs/data/
          if-no-files-found: error
          retention-days: 30

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    name: Deploy GitHub Pages
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
