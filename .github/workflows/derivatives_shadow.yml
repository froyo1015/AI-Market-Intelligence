name: Derivatives Shadow Archive

on:
  schedule:
    - cron: "15 1 * * *"
  workflow_dispatch:
    inputs:
      bootstrap:
        description: "Initialize only when no checkpoint has ever been published"
        type: boolean
        default: false
      provider:
        description: "Explicit shadow venue; OKX is a controlled recovery trial"
        type: choice
        options:
          - binance_usdm
          - okx
        default: binance_usdm

permissions:
  contents: read
  actions: read

concurrency:
  group: derivatives-shadow-archive
  cancel-in-progress: false

jobs:
  shadow:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install and test
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q
          command -v gpg
      - name: Check archive credential
        env:
          DERIVATIVES_ARCHIVE_PASSPHRASE: ${{ secrets.DERIVATIVES_ARCHIVE_PASSPHRASE }}
        run: python -m src.shadow.derivatives.checkpoint check-secret
      - name: Discover previous checkpoint
        id: prior
        uses: actions/github-script@v7
        env:
          BOOTSTRAP: ${{ inputs.bootstrap || false }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo,
              {owner, repo, name: 'derivatives-shadow-checkpoint', per_page: 100});
            const branch = context.payload.repository.default_branch;
            const {orderCheckpoints} = require('./src/shadow/derivatives/checkpoint_order.cjs');
            const candidates = orderCheckpoints(artifacts, branch);
            let selected;
            for (const a of candidates) {
              const {data: run} = await github.rest.actions.getWorkflowRun({owner, repo, run_id: a.workflow_run.id});
              if (run.path === '.github/workflows/derivatives_shadow.yml' &&
                  run.conclusion === 'success' && run.head_branch === branch &&
                  run.repository.full_name === `${owner}/${repo}` &&
                  run.head_repository.full_name === `${owner}/${repo}`) { selected = a; break; }
            }
            if (!selected) {
              if (process.env.BOOTSTRAP !== 'true') throw new Error('Checkpoint missing; explicit bootstrap review required');
              core.setOutput('id', '');
            } else {
              if (selected.expired) throw new Error('Latest checkpoint expired; restore backup before continuing');
              core.setOutput('id', String(selected.id));
              core.setOutput('run_id', String(selected.workflow_run.id));
            }
      - name: Download encrypted checkpoint
        if: steps.prior.outputs.id != ''
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.prior.outputs.id }}
          run-id: ${{ steps.prior.outputs.run_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: outputs/shadow/derivatives/scheduled/restore
      - name: Restore and replay
        if: steps.prior.outputs.id != ''
        env:
          DERIVATIVES_ARCHIVE_PASSPHRASE: ${{ secrets.DERIVATIVES_ARCHIVE_PASSPHRASE }}
        run: >-
          python -m src.shadow.derivatives.checkpoint restore
          --archive outputs/shadow/derivatives/scheduled/history
          --file outputs/shadow/derivatives/scheduled/restore/checkpoint.gpg
      - name: Collect, append and evaluate
        env:
          SHADOW_PROVIDER: ${{ inputs.provider || 'binance_usdm' }}
        run: >-
          python -m src.shadow.derivatives.scheduler
          --archive outputs/shadow/derivatives/scheduled/history
          --output outputs/shadow/derivatives/scheduled/run
          --run-id shadow-${{ github.run_id }}-${{ github.run_attempt }}
          --provider "$SHADOW_PROVIDER"
      - name: Encrypt checkpoint
        env:
          DERIVATIVES_ARCHIVE_PASSPHRASE: ${{ secrets.DERIVATIVES_ARCHIVE_PASSPHRASE }}
        run: >-
          python -m src.shadow.derivatives.checkpoint seal
          --archive outputs/shadow/derivatives/scheduled/history
          --reports outputs/shadow/derivatives/scheduled/run
          --file outputs/shadow/derivatives/scheduled/checkpoint.gpg
      - name: Persist ciphertext only
        uses: actions/upload-artifact@v7
        with:
          name: derivatives-shadow-checkpoint
          path: outputs/shadow/derivatives/scheduled/checkpoint.gpg
          if-no-files-found: error
          retention-days: 30
      - name: Publish validated public projection only
        uses: actions/upload-artifact@v7
        with:
          name: derivatives-shadow-public
          path: outputs/shadow/derivatives/scheduled/run/derivatives-shadow.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish validated operational proof only
        uses: actions/upload-artifact@v7
        with:
          name: derivatives-recovery-proof
          path: outputs/shadow/derivatives/scheduled/run/derivatives-recovery-proof.json
          if-no-files-found: error
          retention-days: 30
